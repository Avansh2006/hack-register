[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."reminder-schedule"]
  schedule = "*/15 * * * *"

# Netlify automatically applies its OpenNext adapter for Next.js.
# Configure secrets in Netlify's environment settings, never in this file.
